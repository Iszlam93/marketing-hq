<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body style="margin:0">
<title>Marketing HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F7F9F9; --sunk:#E8EEEE;
  --ink:#132121; --ink-2:#344645; --muted:#667776; --line:#DCE3E3; --line-2:#C7D2D2;
  --accent:#0A7470; --accent-ink:#FFFFFF; --accent-soft:#DCEFED;
  --amber:#9A600E; --amber-soft:#FBEFD9;
  --good:#1D7A45; --good-soft:#DFF1E6; --bad:#B23A32; --bad-soft:#FAE3E1;
  --c1:#0A7470; --c2:#3A5FB5; --c3:#B7791F; --c4:#8A56A8;
  --shadow:0 1px 2px rgba(19,33,33,.06),0 4px 14px rgba(19,33,33,.05);
  --r:10px;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1313; --surface:#121C1C; --surface-2:#162222; --sunk:#0E1818;
    --ink:#E2ECEB; --ink-2:#B9C8C7; --muted:#879998; --line:#223131; --line-2:#2F4141;
    --accent:#3DB5AE; --accent-ink:#04211F; --accent-soft:#12302E;
    --amber:#E3A84D; --amber-soft:#35280F;
    --good:#55C485; --good-soft:#10301E; --bad:#F07C73; --bad-soft:#3A1615;
    --c1:#3DB5AE; --c2:#7F9EF2; --c3:#E3A84D; --c4:#C197DE;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1313; --surface:#121C1C; --surface-2:#162222; --sunk:#0E1818;
  --ink:#E2ECEB; --ink-2:#B9C8C7; --muted:#879998; --line:#223131; --line-2:#2F4141;
  --accent:#3DB5AE; --accent-ink:#04211F; --accent-soft:#12302E;
  --amber:#E3A84D; --amber-soft:#35280F;
  --good:#55C485; --good-soft:#10301E; --bad:#F07C73; --bad-soft:#3A1615;
  --c1:#3DB5AE; --c2:#7F9EF2; --c3:#E3A84D; --c4:#C197DE;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 14px var(--f-display)}
.logo b{font:700 16px var(--f-display);letter-spacing:-.01em}
.logo span{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 8px 4px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] .ico{color:var(--accent)}
.nav button:disabled{cursor:default;opacity:.55}
.nav button:disabled:hover{background:transparent}
.ico{width:18px;height:18px;flex:none;color:var(--muted)}
.badge{margin-left:auto;font:600 11px var(--f-mono);background:var(--amber);color:var(--surface);border-radius:999px;padding:1px 7px}
.badge:empty{display:none}
.tag-later{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--line)}

.main{min-width:0;padding:20px 28px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font:700 24px/1.2 var(--f-display);letter-spacing:-.015em}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--line-2);padding:3px 9px;border-radius:999px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- common ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
.btn{font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.link{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- command center ---------- */
.brief{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 16px;align-items:start;border-color:var(--line-2)}
.brief-av{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 13px var(--f-display)}
.brief h2{font:700 15px var(--f-ui);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brief p{color:var(--ink-2);margin-top:4px;max-width:78ch}
.brief-cta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{padding:14px 16px 10px}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500}
.kpi-val{font:500 24px/1.2 var(--f-mono);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums;transition:color .4s}
.kpi-val.bump{color:var(--accent)}
.delta{font:600 11.5px var(--f-mono)}
.delta.up-good,.delta.down-good{color:var(--good)}
.delta.up-bad,.delta.down-bad{color:var(--bad)}
.delta.flat{color:var(--muted)}
.spark{display:block;width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:12px;align-items:center}
.bar-name{font-weight:500;font-size:13px}
.bar-name small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.bar-track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--c);border-radius:4px;transition:width .6s ease}
.bar-row.off .bar-fill{background:var(--line-2)}
.bar-val{text-align:right;font:500 13px var(--f-mono)}
.bar-val small{display:block;color:var(--muted);font-size:11px}
.queue{display:flex;flex-direction:column;gap:10px}
.qcard{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:11px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}
.qcard h4{font-size:13.5px;font-weight:600}
.qcard p{font-size:12.5px;color:var(--ink-2)}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line-2);border-radius:8px;text-align:center}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:300px;overflow:auto}
.feed li{display:grid;grid-template-columns:48px 14px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed time{font:400 11.5px var(--f-mono);color:var(--muted)}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.feed li.new{animation:fadein .6s ease}
@keyframes fadein{from{background:var(--accent-soft)}to{background:transparent}}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent)}

/* ---------- wizard ---------- */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;counter-reset:s}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);background:var(--sunk);color:var(--ink-2)}
.step.on{color:var(--ink);border-color:var(--accent)}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.step.done b{background:var(--good-soft);color:var(--good)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.type{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.type:hover{border-color:var(--line-2)}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.type-ico{width:34px;height:34px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2)}
.type[aria-pressed="true"] .type-ico{background:var(--accent);color:var(--accent-ink)}
.type h4{font:700 15px var(--f-display);letter-spacing:-.01em}
.type p{font-size:12.5px;color:var(--ink-2)}
.type .meta{font:500 11.5px var(--f-mono);color:var(--muted);margin-top:auto}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint{font-size:12px;color:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.phase{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.phase-h b{font-size:13.5px}
.phase-h span{font:500 11px var(--f-mono);color:var(--muted)}
.task{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:500}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.flow b{color:var(--ink)}

/* ---------- team ---------- */
.team-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.org{width:100%;height:auto;display:block}
.org .edge{fill:none;stroke:var(--line-2);stroke-width:1.6}
.org .edge.flow{stroke:var(--accent);stroke-dasharray:6 6;animation:dash .8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.org .n-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.org .n-name{fill:var(--ink);font:600 13.5px var(--f-ui)}
.org .n-role{fill:var(--muted);font:400 11.5px var(--f-ui)}
.org .n-dot{fill:var(--muted)}
.org .n-band{fill:var(--c)}
.org .s-working .n-box{stroke:var(--accent);stroke-width:2}
.org .s-working .n-dot{fill:var(--accent);animation:blink 1s ease-in-out infinite}
.org .s-done .n-dot{fill:var(--good)}
.org .s-waiting .n-dot{fill:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.chat{display:flex;flex-direction:column;min-height:420px}
.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px;max-height:440px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.cmo{align-self:flex-start;background:var(--sunk);color:var(--ink);border-bottom-left-radius:4px}
.msg.cmo b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.chat-form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.chat-form input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{font-size:12px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink-2)}
.transcript{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.transcript li{display:grid;grid-template-columns:62px 150px 76px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.transcript time{font:400 11.5px var(--f-mono);color:var(--muted)}
.kind{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kind.tool{color:var(--c2)}.kind.handoff{color:var(--amber)}.kind.result{color:var(--good)}
.transcript .t-text{color:var(--ink-2)}

/* ---------- review ---------- */
.review{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.rv-list{display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
.rv-item{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.rv-item:hover{border-color:var(--line-2)}
.rv-item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rv-item b{font-size:13.5px;font-weight:600;line-height:1.35}
.rv-kind{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.rv-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.rv-head h2{font:700 20px/1.25 var(--f-display);letter-spacing:-.01em}
.rv-actions{display:flex;gap:8px;flex-wrap:wrap}
.sendback{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:8px;padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.sendback textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:8px;min-height:64px;resize:vertical}
.note{font-size:12.5px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);margin-bottom:14px}
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}
.gantt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.gantt{min-width:580px;padding:10px 12px 12px}
.g-row{display:grid;grid-template-columns:minmax(170px,1.4fr) repeat(var(--cols),minmax(38px,1fr));align-items:center;min-height:28px}
.g-row + .g-row{border-top:1px dashed var(--line)}
.g-phase{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-2);padding:4px 6px;background:var(--sunk);border-radius:4px;margin:0 2px;text-align:center}
.g-week{font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.g-label{font-size:12.5px;display:flex;align-items:center;gap:7px;padding-right:8px;min-width:0}
.g-label i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.g-bar{height:12px;border-radius:3px;background:var(--c);margin:0 2px;opacity:.9}
.g-ms{width:12px;height:12px;background:var(--c);transform:rotate(45deg);justify-self:center}
.g-now{grid-row:1/-1}
.side-panel{display:flex;flex-direction:column;gap:14px}
.donut-row{display:flex;gap:14px;align-items:center}
.donut-legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.donut-legend span{display:flex;gap:7px;align-items:center}
.donut-legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}

/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>'€'+Math.round(n).toLocaleString('en-US');
const fmt=(v,f)=>f==='eur'?eur(v):f==='eur2'?'€'+v.toFixed(2):f==='pct'?v.toFixed(2)+'%':f==='x'?v.toFixed(2)+'×':Math.round(v).toLocaleString('en-US');
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const agentColor=a=>(AG[a]||{}).c||(S.connectors.find(c=>c.id===a)||{}).c||'var(--muted)';
const agentName=a=>(AG[a]||{}).name||(S.connectors.find(c=>c.id===a)||{}).name||a;
const chip=a=>`<span class="chip" style="--c:${agentColor(a)}"><i></i>${esc(agentName(a))}</span>`;
const statusPill=s=>({pending:'<span class="pill amber">Needs your call</span>',approved:'<span class="pill good">Approved</span>',rejected:'<span class="pill bad">Rejected</span>',revising:'<span class="pill accent">Revising</span>'}[s]);
const kindLabel={plan:'Campaign plan',social:'Social posts',email:'Email',decision:'Budget decision'};
const pending=()=>S.review.filter(r=>r.status==='pending');
function spark(v,c){const w=160,h=38,p=3;const mn=Math.min(...v),mx=Math.max(...v);const x=i=>p+i*(w-2*p)/(v.length-1);const y=d=>h-p-(d-mn)/((mx-mn)||1)*(h-2*p);const pts=v.map((d,i)=>x(i).toFixed(1)+','+y(d).toFixed(1));const line='M'+pts.join('L');return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="${line}L${x(v.length-1).toFixed(1)},${h}L${p},${h}Z" fill="${c}" opacity=".12"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(v.length-1).toFixed(1)}" cy="${y(v[v.length-1]).toFixed(1)}" r="3" fill="${c}"/></svg>`}
function toast(msg,go){const t=$('#toast');t.innerHTML=esc(msg)+(go?` <button data-go="${go}">Open</button>`:'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200)}
function addFeed(agent,text){S.feed.unshift([now(),agent,text]);S.feed.length=Math.min(S.feed.length,14);const f=$('#feed');if(f)f.innerHTML=feedItems(true)}
function updateBadge(){$('#badge').textContent=pending().length||''}

/* --- command --- */
function kpiTiles(){return Object.entries(S.kpi).map(([k,o])=>{const up=o.d>0;const cls=o.sem==='flat'?'flat':(up?(o.sem==='up'?'up-good':'up-bad'):(o.sem==='down'?'down-good':'down-bad'));const unit=k==='ctr'?' pts':'%';
  return `<div class="card kpi"><div class="kpi-top"><span class="kpi-label">${o.label}</span><span class="delta ${cls}">${up?'▲':'▼'} ${Math.abs(o.d).toFixed(1)}${unit}</span></div><div class="kpi-val" id="k-${k}">${fmt(o.v,o.fmt)}</div>${spark(o.s,k==='spend'?'var(--muted)':'var(--accent)')}</div>`}).join('')}
function channelBars(){const max=Math.max(...S.channels.map(c=>c.leads));return `<div class="bars">${S.channels.map(c=>{const on=S.connectors.find(x=>x.id===c.conn).on;return `<div class="bar-row${on?'':' off'}"><div class="bar-name">${c.name}<small>${on?c.sub:'connection paused'}</small></div><div class="bar-track"><div class="bar-fill" style="--c:${c.c};width:${(c.leads/max*100).toFixed(1)}%"></div></div><div class="bar-val">${c.leads} leads<small>€${(c.spend/c.leads).toFixed(2)} CPL</small></div></div>`}).join('')}</div>`}
function queueCards(){const p=pending();if(!p.length)return '<div class="empty">Nothing waiting. The CMO adds items here when something needs your call.</div>';
  return `<div class="queue">${p.map(r=>`<div class="qcard"><div class="row">${chip(r.agent)}<span class="rv-kind">${kindLabel[r.kind]}</span></div><h4>${esc(r.title)}</h4><p>${esc(r.sum)}</p><div class="row"><button class="btn sm primary" data-act="preview" data-id="${r.id}">Preview</button><button class="btn sm" data-act="approve" data-id="${r.id}">Approve</button><button class="btn sm ghost danger" data-act="reject" data-id="${r.id}">Reject</button></div></div>`).join('')}</div>`}
function feedItems(fresh){return S.feed.map((f,i)=>`<li class="${fresh&&i===0?'new':''}"><time>${f[0]}</time><span class="dot" style="--c:${agentColor(f[1])}"></span><span>${esc(f[2])}</span></li>`).join('')}
function campTable(){return `<div class="tbl-wrap"><table><thead><tr><th>Campaign</th><th>Type</th><th>Status</th><th>Progress</th><th class="r">Budget used</th></tr></thead><tbody>${S.campaigns.map(c=>`<tr><td><b style="font-weight:600">${esc(c.name)}</b></td><td><span class="chip">${PB[c.type].name}</span></td><td>${c.status==='Live'?'<span class="pill good">Live</span>':c.status==='Paused'?'<span class="pill neutral">Paused</span>':'<span class="pill accent">'+c.status+'</span>'}</td><td><div class="prog"><i style="width:${c.progress}%"></i></div></td><td class="r num">${eur(c.spent)} / ${eur(c.budget)}</td></tr>`).join('')}</tbody></table></div>`}
function vCommand(){const p=pending().length;return `<div class="stack">
  <section class="card brief"><div class="brief-av">CMO</div><div><h2>CMO briefing <span class="muted small" style="font-weight:400">today, 08:30</span></h2>
  <p>Leads are up 12% on last week, and Search is doing most of the work. LinkedIn cost per lead has risen three weeks in a row, so I recommend moving €800 to Search. The Q4 App Launch plan is ready for you, and I paused the BC in Practice series to fund it.</p></div>
  <div class="brief-cta">${p?`<span class="pill amber">${p} need${p===1?'s':''} your call</span>`:'<span class="pill good">Nothing waiting</span>'}<button class="btn sm" data-go="review">Open Review Room</button></div></section>
  <section class="kpis" id="kpis">${kpiTiles()}</section>
  <div class="grid-2"><section class="card"><div class="card-head"><span class="eyebrow">Leads by channel · last 30 days</span></div><div id="channels">${channelBars()}</div></section>
  <section class="card"><div class="card-head"><span class="eyebrow">Decisions waiting</span></div><div id="queue">${queueCards()}</div></section></div>
  <div class="grid-2"><section class="card"><div class="card-head"><span class="eyebrow">Live activity</span><span class="muted small">Updates as agents work and data syncs</span></div><ol class="feed" id="feed">${feedItems()}</ol></section>
  <section class="card"><div class="card-head"><span class="eyebrow">Active campaigns</span><button class="btn sm" data-go="wizard">New campaign</button></div>${campTable()}</section></div></div>`}

/* --- wizard --- */
function stepper(){const names=['Type','Goal & budget','Playbook preview','Send to team'];return `<div class="stepper">${names.map((n,i)=>`<div class="step ${S.wiz.step===i+1?'on':S.wiz.step>i+1?'done':''}"><b>${S.wiz.step>i+1?'✓':i+1}</b>${n}</div>`).join('')}</div>`}
function pbPhases(pb){return `<div class="phases">${pb.phases.map(p=>`<div class="phase"><div class="phase-h"><b>${p.name}</b><span>${p.when}</span></div>${p.tasks.map(t=>`<div class="task">${esc(t[0])}<span>${chip(t[1])}</span></div>`).join('')}</div>`).join('')}</div>`}
function vWizard(){const w=S.wiz,pb=PB[w.type];let body='';
  if(w.step===1){body=`<div class="types">${Object.entries(PB).map(([id,p])=>`<button class="type" data-act="wtype" data-id="${id}" aria-pressed="${w.type===id}"><span class="type-ico"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${p.ico}"/></svg></span><h4>${p.name}</h4><p>${p.blurb}</p><span class="meta">${p.phases.length} phases · ${taskCount(p)} tasks</span></button>`).join('')}</div>
    <div class="card" style="margin-top:14px"><div class="flow"><b>${pb.name} playbook:</b> ${pb.phases.map(p=>`${p.name} <span class="muted mono small">(${p.when})</span>`).join(' ▸ ')}</div></div>`}
  if(w.step===2){const d=DEF[w.type];body=`<div class="card"><div class="form">
    <div class="field wide"><label for="w-name">Campaign name</label><input id="w-name" value="${esc(w.name||d[0])}"></div>
    <div class="field"><label for="w-goal">Goal</label><input id="w-goal" value="${esc(w.goal||d[1])}"><span class="hint">Suggested KPIs for this type: ${pb.kpis.join(', ')}</span></div>
    <div class="field"><label for="w-budget">Budget cap (€)</label><input id="w-budget" type="number" min="0" step="250" value="${w.budget}"><span class="hint">The CMO checks this against the Q4 budget (€8,320 unallocated).</span></div>
    <div class="field"><label for="w-weeks">Duration (weeks)</label><input id="w-weeks" type="number" min="1" max="26" value="${w.weeks}"></div>
    <div class="field"><label for="w-aud">Audience</label><input id="w-aud" value="${esc(w.audience)}"></div>
    <div class="field wide"><label for="w-msg">Key message (optional)</label><textarea id="w-msg" placeholder="Leave empty and the Planner will propose one">${esc(w.message)}</textarea></div></div></div>`}
  if(w.step===3){body=`<div class="stack"><div class="card"><div class="card-head"><span class="eyebrow">${pb.name} playbook · ${taskCount(pb)} tasks, each assigned to a specialist</span><span class="muted small">The Planner can add, remove or re-time tasks to fit your budget</span></div>${pbPhases(pb)}</div>
    <div class="card"><dl class="kv"><div><dt>KPIs</dt><dd>${pb.kpis.join(', ')}</dd></div><div><dt>Default channel split</dt><dd>${pb.channels.map(c=>c[0]+' '+c[1]+'%').join(' · ')}</dd></div><div><dt>Approval checkpoints</dt><dd>Plan, every asset, any budget change</dd></div></dl></div></div>`}

    <div class="flow"><span class="chip" style="--c:var(--ink)"><i></i>CMO</span> checks strategy &amp; budget ▸ ${chip('planner')} loads the ${pb.name} playbook ▸ ${chip('seo')} ${chip('content')} ${chip('analyst')} do the work ▸ <b>you review it visually</b></div></div>`}
  return `${stepper()}${body}<div class="wiz-foot"><button class="btn" data-act="wback" ${w.step===1?'disabled':''}>Back</button>${w.step<4?`<button class="btn primary" data-act="wnext">Continue</button>`:`<button class="btn primary" data-act="wsend" ${S.running?'disabled':''}>${S.running?'Team is busy':'Send to CMO'}</button>`}</div>`}

function orgChart(){const e=(id,d)=>`<path class="edge${id!=='cmo'&&S.agents[id][0]==='working'?' flow':''}" id="e-${id}" d="${d}"/>`;
  const edges=e('planner','M380 80 V130')+['content','seo','analyst'].map(a=>e(a,`M380 190 V225 H${POS[a][0]} V260`)).join('');

function setAgent(a,st,note){S.agents[a]=[st,note];const g=$('#n-'+a);if(g){g.setAttribute('class','node s-'+st);$('#t-'+a).textContent=note}const e=$('#e-'+a);if(e)e.setAttribute('class','edge'+(st==='working'?' flow':''))}

function cmoReply(q){const s=q.toLowerCase();
  if(/15k|15,000|15 000|big launch/.test(s))return 'I’d push back on that. €15k is more than the €8,320 we have unallocated this quarter, and a second launch a month after Q4 App Launch would split the same ISV audience. My proposal: run it in January with €9k, and use December for a lead-gen push that warms the audience up. Want me to brief the Planner on that version?';
  if(/budget|spend|money|left/.test(s))return 'Q4 budget is €22,500. €14,180 is committed across four campaigns, which leaves €8,320. I’d keep €2,000 in reserve for launch week and put the rest behind whatever Search keeps delivering.';

});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();const i=$('#chatinput');sendChat(i.value);i.value=''}});
function readWiz(){const v=id=>($('#'+id)||{}).value;S.wiz.name=v('w-name')||S.wiz.name;S.wiz.goal=v('w-goal')||S.wiz.goal;S.wiz.budget=Math.max(0,+v('w-budget')||S.wiz.budget);S.wiz.weeks=Math.max(1,+v('w-weeks')||S.wiz.weeks);S.wiz.audience=v('w-aud')||S.wiz.audience;S.wiz.message=v('w-msg')||''}
function saveEdits(){if(!S.editing)return;const pt=$('#post-text');if(pt)S.posts[S.post].text=pt.innerText.replace(/…\s*see more$/,'').trim();const eb=$('#email-body');if(eb){const ps=[...eb.querySelectorAll('p')].map(p=>p.innerText.trim()).filter(Boolean);if(ps.length)S.email.body=ps;const h=eb.querySelector('h3');if(h)S.email.subject=h.innerText.trim()}}

/* ============ live ticking ============ */
const SYNCMSG={hubspot:n=>`HubSpot sync: ${n} new contacts`,linkedin:n=>`LinkedIn sync: ${n*140} impressions`,ga4:n=>`GA4 sync: ${n*9} sessions`,gads:n=>`Google Ads sync: ${n*6} clicks`};
function doSync(c){const n=1+Math.floor(Math.random()*4);c.ago=0;c.rows+=n*12;const ch=S.channels.find(x=>x.conn===c.id);
  if(Math.random()<.7){const l=1+Math.floor(Math.random()*2);ch.leads+=l;S.kpi.leads.v+=l;S.kpi.leads.s[29]+=l}
  if(c.id!=='ga4'){const sp=10+Math.random()*30;ch.spend+=sp;S.kpi.spend.v+=sp;S.kpi.spend.s[29]+=sp}
  S.kpi.cpl.v=S.kpi.spend.v/S.kpi.leads.v;S.kpi.ctr.v=Math.max(2.5,Math.min(3.3,S.kpi.ctr.v+(Math.random()-.48)*.02));
  if(c.id==='hubspot'||Math.random()<.35)addFeed(c.id,SYNCMSG[c.id](n));paintLive(true)}
function paintLive(bump){const k=$('#kpis');if(k){k.innerHTML=kpiTiles();if(bump){const el=$('#k-leads');if(el){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),900)}}}
  const ch=$('#channels');if(ch)ch.innerHTML=channelBars()}
setInterval(()=>{S.connectors.forEach(c=>{if(!c.on)return;c.ago+=1;if(c.ago>=c.every)doSync(c);const s=$('#sync-'+c.id);if(s)s.textContent=syncLabel(c);const r=$('#rows-'+c.id);if(r)r.textContent=c.rows.toLocaleString('en-US')})},1000);

setView((location.hash||'').slice(1)||'command');
</script>
