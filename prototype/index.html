<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body style="margin:0">
<title>Marketing HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('mhq-theme')}catch(e){}
if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{
  --bg:#F5F7F7; --surface:#FFFFFF; --surface-2:#F9FAFA; --sunk:#EDF1F1;
  --ink:#152222; --ink-2:#3A4A49; --muted:#6B7A79; --line:#E2E7E7; --line-2:#CFD7D7;
  --accent:#0A7470; --accent-ink:#FFFFFF; --accent-soft:#E0F1EF;
  --amber:#97600F; --amber-soft:#FBF0DC;
  --good:#1D7A45; --good-soft:#E2F3E8; --bad:#B23A32; --bad-soft:#FBE6E4;
  --c1:#0A7470; --c2:#3A5FB5; --c3:#B4761C; --c4:#8A56A8;
  --r:10px;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1414; --surface:#131C1C; --surface-2:#172121; --sunk:#0F1818;
    --ink:#E3ECEB; --ink-2:#BCCAC9; --muted:#8A9B9A; --line:#223030; --line-2:#2F4040;
    --accent:#3DB5AE; --accent-ink:#04211F; --accent-soft:#13302E;
    --amber:#E3A84D; --amber-soft:#33270F;
    --good:#55C485; --good-soft:#11301F; --bad:#F07C73; --bad-soft:#3A1716;
    --c1:#3DB5AE; --c2:#86A3F2; --c3:#E3A84D; --c4:#C59BE0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1414; --surface:#131C1C; --surface-2:#172121; --sunk:#0F1818;
  --ink:#E3ECEB; --ink-2:#BCCAC9; --muted:#8A9B9A; --line:#223030; --line-2:#2F4040;
  --accent:#3DB5AE; --accent-ink:#04211F; --accent-soft:#13302E;
  --amber:#E3A84D; --amber-soft:#33270F;
  --good:#55C485; --good-soft:#11301F; --bad:#F07C73; --bad-soft:#3A1716;
  --c1:#3DB5AE; --c2:#86A3F2; --c3:#E3A84D; --c4:#C59BE0; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 6px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-ui)}
.logo b{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.logo span{display:block;font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] .ico{color:var(--accent)}
.ico{width:18px;height:18px;flex:none;color:var(--muted)}
.lnum{width:18px;height:18px;flex:none;border-radius:5px;display:grid;place-items:center;font:600 10.5px var(--f-mono);color:#fff;background:var(--c)}
.badge{margin-left:auto;font:600 11px var(--f-mono);background:var(--amber);color:var(--surface);border-radius:999px;padding:1px 7px}
.badge:empty{display:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}

.main{min-width:0;padding:22px 28px 56px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--line-2);padding:3px 9px;border-radius:999px}
.theme{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface)}
.theme button{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme svg{width:14px;height:14px}

/* common */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.btn{font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.tagc{display:inline-flex;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunk);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line-2);border-radius:8px;text-align:center}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .5s}
.rag{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rag.g{background:var(--good)}.rag.a{background:var(--amber)}.rag.r{background:var(--bad)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.vbadge{font:600 12px var(--f-mono);background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 18px;margin:0}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:500}

/* command */
.brief{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px 16px;align-items:start}
.brief-av{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 12.5px var(--f-ui)}
.brief h2{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brief p{color:var(--ink-2);margin-top:4px;max-width:80ch}
.brief-cta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{padding:14px 16px 10px}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-label{font-size:12px;color:var(--muted);font-weight:500;line-height:1.3}
.kpi-val{font:500 23px/1.2 var(--f-mono);letter-spacing:-.02em;margin:7px 0 4px;transition:color .4s}
.kpi-val.bump{color:var(--accent)}
.delta{font:600 11px var(--f-mono);white-space:nowrap}
.delta.gd{color:var(--good)}.delta.bd{color:var(--bad)}
.spark{display:block;width:100%;height:auto}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center}
.bar-name{font-weight:500;font-size:13px}
.bar-name small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.bar-track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--c);border-radius:4px;transition:width .6s}
.bar-val{text-align:right;font:500 13px var(--f-mono)}
.queue{display:flex;flex-direction:column;gap:10px}
.qcard{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:11px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px}
.qcard h4{font-size:13.5px;font-weight:600}
.qcard p{font-size:12.5px;color:var(--ink-2)}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:330px;overflow:auto}
.feed li{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed time{font:400 11.5px var(--f-mono);color:var(--muted)}
.feed .dot{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.feed li.new{animation:fadein .8s ease}
@keyframes fadein{from{background:var(--accent-soft)}to{background:transparent}}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow b{font-weight:600;font-size:13.5px}

/* team */
.team-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.org{width:100%;height:auto;display:block}
.org .edge{fill:none;stroke:var(--line-2);stroke-width:1.5}
.org .edge.flow{stroke:var(--accent);stroke-dasharray:6 6;animation:dash .8s linear infinite}
.org .loop{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 5}
.org .loop-t{fill:var(--muted);font:500 11.5px var(--f-ui)}
@keyframes dash{to{stroke-dashoffset:-12}}
.org .n-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.2}
.org .n-name{fill:var(--ink);font:600 13px var(--f-ui)}
.org .n-sp{fill:var(--ink-2);font:500 12px var(--f-ui)}
.org .n-role{fill:var(--muted);font:400 11px var(--f-ui)}
.org .n-dot{fill:var(--line-2)}
.org .n-band{fill:var(--c)}
.org .l-tag{fill:var(--muted);font:600 10.5px var(--f-mono);letter-spacing:.06em}
.org .s-working .n-box{stroke:var(--accent);stroke-width:2}
.org .s-working .n-dot{fill:var(--accent);animation:blink 1s ease-in-out infinite}
.org .s-done .n-dot{fill:var(--good)}
.org .s-waiting .n-dot{fill:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.chat{display:flex;flex-direction:column;min-height:440px}
.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 12px;max-height:470px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px}
.msg.you{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.cmo{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg.cmo b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.chat-form{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.chat-form input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{font-size:12px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--ink-2)}
.transcript{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.transcript li{display:grid;grid-template-columns:52px 190px 72px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.transcript time{font:400 11.5px var(--f-mono);color:var(--muted)}
.kind{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.kind.tool{color:var(--c2)}.kind.handoff{color:var(--amber)}.kind.result{color:var(--good)}
.t-text{color:var(--ink-2)}

/* foundations */
.fhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.statement{font-size:16px;line-height:1.6;max-width:80ch;padding:14px 16px;border-left:3px solid var(--c2);background:var(--surface-2);border-radius:0 8px 8px 0}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-top:16px}
.part{border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.part span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
[contenteditable="true"]{outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px}
.house{margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.house-roof{background:var(--ink);color:var(--bg);padding:12px 16px;font-weight:700;font-size:15px;text-align:center}
.house-roof small{display:block;font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.7}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pillar{padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.pillar + .pillar{border-left:1px solid var(--line)}
.pillar b{font-size:14px}
.pillar ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.persona{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.persona h4{font-size:14.5px}
.persona dl{margin:0;display:flex;flex-direction:column;gap:5px}
.persona dt{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.persona dd{margin:0;color:var(--ink-2)}
.persona .msgq{font-weight:600;color:var(--ink)}
.icp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.icp ul{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.dmu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dmu div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dmu b{font-size:14px}
.journey{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.journey span{font-size:12.5px;background:var(--sunk);border-radius:6px;padding:5px 10px}
.journey span::after{content:" →";color:var(--muted)}
.journey span:last-child::after{content:""}
.ccell{text-align:center}
.yes{color:var(--good);font-weight:700}
.release{border:1px solid var(--accent);border-radius:10px;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:14px}
.relopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.relopt{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.relopt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.relopt b{font-size:13.5px}
.relopt span{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:60px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.assess{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvl div{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--muted)}
.lvl div.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.hist{display:flex;flex-direction:column;gap:0}
.hist-item{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}

.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

.conns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10;max-width:calc(100vw - 36px)}

@media (max-width:1200px){.grid-2,.team-grid,.dec-grid{grid-template-columns:minmax(0,1fr)}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas div:nth-child(4n){border-right:1px solid var(--line)}.canvas div:nth-child(2n){border-right:0}.canvas div:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.canvas div:nth-last-child(-n+2){border-bottom:0}}

function rng(seed){return function(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);
function series(end,n,vol,trend){const out=[];const st=end*(1-trend);for(let i=0;i<n;i++){out.push((st+(end-st)*i/(n-1))*(1+(R()-.5)*vol))}out[n-1]=end;return out}

const LC={0:'var(--ink)',1:'var(--c2)',2:'var(--c4)',3:'var(--c3)',a:'var(--c1)'};

  mat:{name:'Materials lead',L:2,role:'Builds from approved foundations'},

  gtm:{name:'Go-to-market lead',L:3,role:'Launches and campaigns'},

};

const PB={

function spark(v,c){const w=160,h=36,p=3;const mn=Math.min(...v),mx=Math.max(...v);const x=i=>p+i*(w-2*p)/(v.length-1);const y=d=>h-p-(d-mn)/((mx-mn)||1)*(h-2*p);const line='M'+v.map((d,i)=>x(i).toFixed(1)+','+y(d).toFixed(1)).join('L');return `<svg viewBox="0 0 ${w} ${h}" class="spark" aria-hidden="true"><path d="${line}L${x(v.length-1).toFixed(1)},${h}L${p},${h}Z" fill="${c}" opacity=".1"/><path d="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(v.length-1).toFixed(1)}" cy="${y(v[v.length-1]).toFixed(1)}" r="3" fill="${c}"/></svg>`}
function toast(msg,go){const t=$('#toast');t.innerHTML=esc(msg)+(go?` <button data-go="${go}">Open</button>`:'');t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)}

  document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===t))}

/* ================= views ================= */
const VIEWS={
  command:{t:'Command Center',s:'What the team is doing across all three layers, and what needs your call'},
  review:{t:'Review Room',s:'Every proposal shown the way it will look. Approve, edit or send it back'},
  team:{t:'Team & CMO',s:'Your CMO runs three layers: Foundations, Materials and Go-to-market'},
  foundations:{t:'Foundations',s:'The source of truth: positioning, ICP, buying committee, competitors and features'},
  materials:{t:'Materials',s:'Everything Sales and partners use, each built from a version of the foundations'},
  gtm:{t:'Go-to-market',s:'Launches with readiness, and campaigns from playbooks'},
  wizard:{t:'New launch or campaign',s:'Pick a playbook. Each one assigns work across the three layers'},
  connections:{t:'Connections',s:'Data sources feeding the team. Add more over time'}
};
let view='command';
function setView(v){if(!VIEWS[v])v='command';view=v;S.sendback=false;
  document.querySelectorAll('#nav button[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===(v==='wizard'?'gtm':v)?'page':'false'));
  $('#vtitle').textContent=VIEWS[v].t;$('#vsub').textContent=VIEWS[v].s;render();window.scrollTo(0,0);
  try{history.replaceState(null,'','#'+v)}catch(e){}}
function render(){$('#view').innerHTML=({command:vCommand,review:vReview,team:vTeam,foundations:vFound,materials:vMat,gtm:vGtm,wizard:vWizard,connections:vConn})[view]();updateBadge();
  if(view==='team'){const l=$('#chatlog');if(l)l.scrollTop=l.scrollHeight}}

/* ---------- command ---------- */
function kpiTiles(){return Object.entries(S.kpi).map(([k,o])=>{const good=(o.d>0)===o.up;return `<div class="card kpi"><div class="kpi-top"><span class="kpi-label">${o.label}</span><span class="delta ${good?'gd':'bd'}">${o.d>0?'▲':'▼'} ${Math.abs(o.d)}${o.u==='%'?'%':' pts'}</span></div><div class="kpi-val num" id="k-${k}">${o.f(o.v)}</div>${spark(o.s,'var(--accent)')}</div>`}).join('')}
function winBars(){return `<div class="bars">${S.winby.map(w=>`<div class="bar-row"><div class="bar-name">vs ${w[0]}<small>${w[1]}</small></div><div class="bar-track"><div class="bar-fill" style="--c:${w[3]};width:${w[2]}%"></div></div><div class="bar-val">${w[2]}%</div></div>`).join('')}</div><p class="muted small" style="margin-top:12px">22% of opportunities end in no decision. Research Interviews is reviewing 8 of them.</p>`}
function queueCards(){const p=pending();if(!p.length)return '<div class="empty">Nothing waiting. The CMO adds items here when something needs your call.</div>';
  return `<div class="queue">${p.slice(0,4).map(r=>`<div class="qcard"><div class="row">${chip(r.agent)}<span class="rv-kind">${KIND[r.kind]}</span></div><h4>${esc(r.title)}</h4><p>${esc(r.sum)}</p><div class="row"><button class="btn sm primary" data-act="preview" data-id="${r.id}">Preview</button><button class="btn sm" data-act="approve" data-id="${r.id}">Approve</button></div></div>`).join('')}${p.length>4?`<button class="btn sm ghost" data-go="review">${p.length-4} more in the Review Room</button>`:''}</div>`}
function feedItems(fresh){return S.feed.map((f,i)=>`<li class="${fresh&&i===0?'new':''}"><time>${f[0]}</time><span class="dot" style="--c:${aColor(f[1])}"></span><span>${esc(f[2])}</span></li>`).join('')}
function vCommand(){const p=pending().length;const stale=S.materials.filter(m=>m.status==='stale').length;return `<div class="stack">
  <section class="card brief"><div class="brief-av">CMO</div><div><h2>CMO briefing <span class="muted small" style="font-weight:400">today, 08:30</span></h2>
  <p>Win rate is up 3 points, but we’re losing ground to Competitor A since their price cut. Sales has a refreshed battlecard waiting for you. Scenario Planner launches 3 November at 71% readiness, and the website is the blocker. Deal Risk Scoring needs a small messaging update to the foundations. Positioning stays the same.</p></div>
  <div class="brief-cta">${p?`<span class="pill amber">${p} need${p===1?'s':''} your call</span>`:'<span class="pill good">Nothing waiting</span>'}<button class="btn sm" data-go="review">Open Review Room</button></div></section>
  <section class="kpis" id="kpis">${kpiTiles()}</section>
  <div class="grid-2"><div class="stack">
   <section class="card"><div class="card-head"><span class="eyebrow">Win rate by competitor · this quarter</span></div>${winBars()}</section>
   <section class="card"><div class="card-head"><span class="eyebrow">Upcoming launches</span><button class="btn sm ghost" data-go="gtm">Calendar</button></div>
     ${S.launches.map(l=>`<div class="lrow"><b><span class="tier">${l.tier}</span> ${esc(l.name)}</b><span class="mono small muted">${l.date} · ${readyPct(l)}% ready</span><div class="prog" style="grid-column:1/-1"><i style="width:${readyPct(l)}%"></i></div></div>`).join('')}</section>
   <section class="card"><div class="card-head"><span class="eyebrow">Foundations</span><span class="vbadge">v${F.ver}</span></div>
     <p style="font-weight:600">${esc(F.umbrella)}</p><p class="muted small" style="margin-top:4px">Approved ${F.approved}. Source of truth for ${S.materials.length} materials and ${S.launches.length} launches.</p>
     <div class="row" style="margin-top:12px">${S.review.some(r=>r.kind==='foundation'&&r.status==='pending')?'<span class="pill amber">Change proposed</span>':'<span class="pill good">No open changes</span>'}${stale?`<span class="pill bad">${stale} materials out of date</span>`:''}<button class="btn sm ghost" data-go="foundations">Open</button></div></section></div>
  <section class="card"><div class="card-head"><span class="eyebrow">Decisions waiting</span></div><div id="queue">${queueCards()}</div></section></div>
  <div>
   <section class="card"><div class="card-head"><span class="eyebrow">Live activity</span><span class="muted small">Agents and connected data, as it happens</span></div><ol class="feed" id="feed">${feedItems()}</ol></section>
  </div></div>`}

/* ---------- team ---------- */
const OX={found:170,mat:480,gtm:790};
function orgChart(){const st=a=>S.agents[a][0];
  const box=(a,x,y,w,h,big)=>`<g class="node s-${st(a)}" id="n-${a}" style="--c:${aColor(a)}"><rect class="n-box" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="9"/><rect class="n-band" x="${x-w/2}" y="${y-h/2}" width="4" height="${h}" rx="2"/><circle class="n-dot" cx="${x+w/2-13}" cy="${y-(big?h/2-14:0)}" r="4"/>${big?`<text class="n-name" x="${x-w/2+16}" y="${y-4}">${AG[a].name}</text><text class="n-role" id="t-${a}" x="${x-w/2+16}" y="${y+14}">${esc(S.agents[a][1])}</text>`:`<text class="n-sp" x="${x-w/2+16}" y="${y+4}">${AG[a].name}</text>`}</g>`;
  let s='';
  s+=`<path class="edge" d="M580 46 H 680"/>`;
  Object.entries(OX).forEach(([l,x])=>{s+=`<path class="edge${st(l)==='working'?' flow':''}" id="e-${l}" d="M480 74 V96 H${x} V124"/>`;
    const n=SPECS[l].length;s+=`<path class="edge${SPECS[l].some(a=>st(a)==='working')?' flow':''}" id="sp-${l}" d="M${x} 180 V${226+(n-1)*44}"/>`});
  s+=`<path class="loop" d="M${OX.gtm+110} 152 H 920 V 440 H 40 V 152 H ${OX.found-110}" marker-end="url(#arr)"/><text class="loop-t" x="480" y="428" text-anchor="middle">↺ results, win/loss and new insights flow back into Foundations</text>`;
  [1,2,3].forEach(L=>{s+=`<text class="l-tag" x="${OX[LEAD[L]]-110}" y="116">${L} · ${LNAME[L].toUpperCase()}</text>`});
  s+=box('cmo',480,46,200,56,true)+box('analyst',780,46,190,56,true);
  Object.entries(OX).forEach(([l,x])=>{s+=box(l,x,152,220,56,true);SPECS[l].forEach((a,i)=>{s+=box(a,x,226+i*44,206,32,false)})});
  return `<svg class="org" viewBox="0 0 960 460" role="img" aria-label="Team structure: CMO with Analyst; three layer leads for Foundations, Materials and Go-to-market, each with specialists"><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${s}</svg>`}
function setAgent(a,st,note){S.agents[a]=[st,note||S.agents[a][1]];const g=$('#n-'+a);if(g){g.setAttribute('class','node s-'+st);const t=$('#t-'+a);if(t)t.textContent=S.agents[a][1]}
  const e=$('#e-'+a);if(e)e.setAttribute('class','edge'+(st==='working'?' flow':''));
  const L=AG[a].L;if(typeof L==="number"&&L>0&&LEAD[L]!==a){const lead=LEAD[L];const sp=$('#sp-'+lead);if(sp)sp.setAttribute('class','edge'+(SPECS[lead].some(x=>S.agents[x][0]==='working')?' flow':''))}}
function chatMsgs(){return S.chat.map(m=>`<div class="msg ${m[0]}">${m[0]==='cmo'?'<b>CMO</b>':''}${esc(m[1])}</div>`).join('')}
function trItems(){return S.transcript.map(t=>`<li><time>${t[0]}</time><span>${chip(t[1])}</span><span class="kind ${t[2]}">${t[2]}</span><span class="t-text">${esc(t[3])}</span></li>`).join('')}
function vTeam(){return `<div class="stack"><section class="card"><div class="card-head"><span class="eyebrow">Who does what</span><span class="muted small" id="runstate">${S.running?'Run in progress':'Idle. Start a launch or campaign to see the team work'}</span></div>${orgChart()}
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Working</span><span><i style="background:var(--amber)"></i>Waiting on team</span><span><i style="background:var(--good)"></i>Done</span><span><i style="background:var(--line-2)"></i>Idle</span></div></section>
  <div class="team-grid"><section class="card"><div class="card-head"><span class="eyebrow">Run transcript · ${esc(S.runName)}</span><span class="muted small">Every step, tool call and handoff</span></div><ol class="transcript" id="transcript">${trItems()}</ol></section>
  <section class="card chat"><div class="card-head"><span class="eyebrow">Chat with your CMO</span><span class="muted small">Scripted in this prototype</span></div><div class="chat-log" id="chatlog">${chatMsgs()}</div>
  <form class="chat-form" id="chatform"><input id="chatinput" placeholder="Ask the CMO, or give it a goal" autocomplete="off"><button class="btn primary">Send</button></form>
  <div class="suggest"><button data-act="ask" data-q="How are we doing?">How are we doing?</button><button data-act="ask" data-q="Should we change our positioning after losing the big deal to Competitor A?">Change positioning?</button><button data-act="ask" data-q="What about Competitor A's price cut?">Competitor A price cut?</button><button data-act="ask" data-q="Let's add a second T1 launch in November">Second T1 in November</button></div></section></div></div>`}
function cmoReply(q){const s=q.toLowerCase();
  if(/position/.test(s))return 'Not on the back of one deal. Positioning changes need evidence: a pattern in win/loss, or a release that changes who we serve. I’ll have Research Interviews run 8 win/loss calls on recent Competitor A losses. If a pattern shows up, Foundations will propose a change and you’ll see the diff.';
  if(/second|another t1|two t1/.test(s))return 'I’d push back. Sales can absorb one T1 a month. A second in November would mean two trainings and two decks in three weeks, and Scenario Planner readiness is already at 71%. My proposal: make it a T2 in November, or a T1 in January. Want the GTM lead to plan both options?';
  if(/price|competitor a/.test(s))return 'Competitor A cut list price by 15% for mid-market. We shouldn’t follow. Our win rate against them only dropped in deals where price came up before value. The refreshed battlecard moves the explainability demo earlier and adds a total-cost comparison. It’s waiting for your approval.';
  if(/how|doing|status|week/.test(s))return 'Win rate 31% (up 3 points). Pipeline influenced €1.84M (up 18%). The risk is Competitor A: our win rate against them is down to 38%. Scenario Planner is 71% ready, and the website is the blocker. Six items are in your Review Room.';
  return 'Noted. I’ll check it against the foundations and this quarter’s priorities, then come back with a recommendation. If it doesn’t fit, I’ll say why before anyone starts.'}
function sendChat(q){if(!q.trim())return;S.chat.push(['you',q]);const l=$('#chatlog');if(l){l.innerHTML=chatMsgs();l.scrollTop=l.scrollHeight}
  setAgent('cmo','working','Thinking…');setTimeout(()=>{S.chat.push(['cmo',cmoReply(q)]);setAgent('cmo','idle','Watching all three layers');const l=$('#chatlog');if(l){l.innerHTML=chatMsgs();l.scrollTop=l.scrollHeight}},1100)}
function tr(a,k,t){S.transcript.push([now(),a,k,t]);const el=$('#transcript');if(el){el.innerHTML=trItems();el.scrollTop=el.scrollHeight}}
function pushChat(m){S.chat.push(['cmo',m]);const l=$('#chatlog');if(l){l.innerHTML=chatMsgs();l.scrollTop=l.scrollHeight}}

function runTeam(obj){S.running=true;S.runName=obj.name;S.transcript=[];const pb=PB[obj.type];const steps=[];const at=(d,f)=>steps.push([d,f]);
  const per={};pb.phases.forEach(p=>p.tasks.forEach(t=>{per[t[1]]=(per[t[1]]||0)+1}));
  at(300,()=>{setAgent('cmo','working','Checking strategy & budget');tr('cmo','think',`New request: ${pb.name}, “${obj.name}”. Checking priorities, budget and the launch calendar.`)});
  at(1200,()=>{tr('cmo','handoff',`Mandate to Go-to-market lead: ${obj.goal}, cap ${eur(obj.budget)}.`);setAgent('cmo','waiting','Waiting for the plan');setAgent('gtm','working','Loading '+pb.name+' playbook');
    pushChat(`“${obj.name}” fits this quarter’s priorities. I’ve given the Go-to-market lead a ${eur(obj.budget)} cap. The plan will be in your Review Room shortly.`)});
  at(1100,()=>tr('gtm','tool',`load_playbook("${obj.type}") → ${pb.phases.length} phases, ${taskCount(pb)} tasks`));
  at(900,()=>tr('gtm','tool',`get_foundations() → v${F.ver}, approved ${F.approved}`));
  [1,2,3].forEach(L=>{const specs=Object.keys(per).filter(a=>AG[a].L===L&&a!==LEAD[L]);const leadTasks=per[LEAD[L]]||0;if(!specs.length&&!leadTasks)return;
    at(900,()=>{if(L!==3)setAgent(LEAD[L],'working','Assigning '+LNAME[L]+' tasks');const n=specs.reduce((s,a)=>s+per[a],0)+leadTasks;tr('gtm','handoff',`Assigned ${n} ${LNAME[L]} task${n>1?'s':''}`);specs.forEach(a=>setAgent(a,'working'))});
    at(1500,()=>{specs.forEach(a=>setAgent(a,'done'));if(L!==3)setAgent(LEAD[L],'done','Checked against v'+F.ver);tr(LEAD[L],'result',L===1?'Impact check: no positioning change needed.':L===2?'Materials drafted from Foundations v'+F.ver+'.':'Channel plan and content drafted.')})});
  if(per.analyst)at(900,()=>{setAgent('analyst','working','Setting the baseline');tr('analyst','result','Baseline from the last 90 days. Success metric agreed.')});
  at(1000,()=>{setAgent('analyst','idle','Daily sweep at 07:00');setAgent('gtm','working','Reviewing the plan');tr('gtm','think','Checked every task against the foundations and the budget cap.')});
  at(1100,()=>{setAgent('gtm','done','Plan submitted');setAgent('cmo','working','Final review');tr('cmo','think','Plan fits the budget and priorities. Sending it to you for approval.')});
  at(900,()=>{const id='lp-'+obj.id;S.review.unshift({id,kind:'launch',lid:obj.id,title:obj.name+': plan',agent:'gtm',sum:`${pb.name} playbook, ${taskCount(pb)} tasks across ${layersOf(pb).size} layers.`,status:'pending',v:1});
    Object.keys(S.agents).forEach(a=>setAgent(a,'idle',a==='cmo'?'Watching all three layers':a==='analyst'?'Daily sweep at 07:00':'Ready'));S.running=false;S.sel=id;
    addFeed('gtm',`Plan for ${obj.name} is ready for review`);pushChat(`The plan for “${obj.name}” is in your Review Room.`);updateBadge();const rs=$('#runstate');if(rs)rs.textContent='Run finished';
    if(view==='command')render();toast('New plan ready for review','review')});
  let t=0;steps.forEach(([d,f])=>{t+=d;setTimeout(f,t)})}

/* ---------- foundations ---------- */
function vFound(){const tabs=[['positioning','Positioning'],['icp','ICP & personas'],['dmu','Buying committee'],['comp','Competitive'],['features','Feature catalog'],['history','History']];
  const pend=S.review.find(r=>r.kind==='foundation'&&r.status==='pending');
  return `<div class="stack"><section class="card"><div class="fhead"><div class="row"><span class="vbadge">v${F.ver}</span><span><b>Approved ${F.approved}</b> <span class="muted">· source of truth for ${S.materials.length} materials and ${S.launches.length} launches</span></span>${pend?`<button class="pill amber" style="border:0;cursor:pointer" data-act="preview" data-id="${pend.id}">Change proposed: ${esc(REL[pend.rel]?REL[pend.rel].name:pend.title)}</button>`:''}</div>
   <div class="row"><button class="btn" data-act="ftab" data-id="history">Version history</button><button class="btn primary" data-act="relopen">New release</button></div></div></section>
  ${S.rel.open?relPanel():''}
  <section class="card"><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${S.ftab===t[0]}" data-act="ftab" data-id="${t[0]}">${t[1]}</button>`).join('')}</div>${fTab()}</section></div>`}
function fTab(){const e=S.fedit;
  if(S.ftab==='positioning')return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span class="eyebrow">Positioning statement</span>${e?'<div class="row"><button class="btn sm ghost" data-act="fcancel">Cancel</button><button class="btn sm primary" data-act="fsave">Save as v'+nextVer('messaging')+'</button></div>':'<button class="btn sm" data-act="fedit">Edit</button>'}</div>
    <div class="statement" id="f-statement" ${e?'contenteditable="true"':''}>${esc(F.statement)}</div>
    <div class="parts">${F.parts.map((p,i)=>`<div class="part"><span>${p[0]}</span><div id="f-part-${i}" ${e?'contenteditable="true"':''}>${esc(p[1])}</div></div>`).join('')}</div>
    ${e?'<p class="hint" style="margin-top:10px">Your direct edits save straight away as a new version, and materials built on Positioning are flagged.</p>':''}
    <div class="house"><div class="house-roof"><small>Messaging house · umbrella</small>${esc(F.umbrella)}</div><div class="pillars">${F.pillars.map(p=>`<div class="pillar"><span class="eyebrow">Pillar</span><b>${p.name}</b><span class="small muted">${esc(p.line)}</span><ul>${p.proof.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
  if(S.ftab==='icp')return `<div class="icp"><div class="part"><span>Ideal customer</span><ul>${F.icp.firmo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="part"><span>Buying triggers</span><ul>${F.icp.triggers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="part"><span>Disqualifiers</span><ul>${F.icp.disq.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <div class="personas">${F.personas.map(p=>`<div class="persona"><div class="row" style="justify-content:space-between"><h4>${esc(p.name)}</h4><span class="pill neutral">${p.role}</span></div><dl><div><dt>Goal</dt><dd>${esc(p.goals)}</dd></div><div><dt>Pain</dt><dd>${esc(p.pains)}</dd></div><div><dt>Key message</dt><dd class="msgq">${esc(p.msg)}</dd></div></dl></div>`).join('')}</div>`;
  if(S.ftab==='dmu')return `<div class="dmu">${F.dmu.map(d=>`<div><div class="row" style="justify-content:space-between"><b>${esc(d[0])}</b><span class="pill neutral">${d[1]}</span></div><span class="muted small">${esc(d[2])}</span><span class="small">Influence</span><div class="prog"><i style="width:${d[3]}%"></i></div></div>`).join('')}</div>
    <div class="eyebrow" style="margin-top:18px">Typical buying journey</div><div class="journey">${F.journey.map(j=>`<span>${esc(j)}</span>`).join('')}</div>`;
  if(S.ftab==='comp')return `<div class="tbl-wrap"><table><thead><tr>${F.compHead.map((h,i)=>`<th class="${i?'ccell':''}">${h}</th>`).join('')}</tr></thead><tbody>${F.comp.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'ccell':''}${c==='✓'?' yes':''}" ${i===1?'style="font-weight:600"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="eyebrow" style="margin:18px 0 8px">Latest competitor moves</div>${F.moves.map(m=>`<div class="lrow"><span><b>${m[0]}</b> · ${esc(m[1])}</span><span class="mono small muted">${m[2]}</span></div>`).join('')}`;
  if(S.ftab==='features')return `<div class="tbl-wrap"><table><thead><tr><th>Feature</th><th>Value</th><th>Who cares</th><th>Status</th><th>Release</th></tr></thead><tbody>${F.features.map(f=>`<tr><td><b style="font-weight:600">${esc(f[0])}</b></td><td>${esc(f[1])}</td><td class="small">${esc(f[2])}</td><td>${f[3]==='GA'?'<span class="pill good">GA</span>':f[3]==='Launching'?'<span class="pill accent">Launching</span>':'<span class="pill neutral">'+f[3]+'</span>'}</td><td class="mono small">${f[4]}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:10px">Add releases with <b>New release</b>. Later, Jira adds them automatically.</p>`;
  return `<div class="hist">${F.history.map((h,i)=>`<div class="hist-item"><div><span class="vbadge" style="${i?'background:var(--sunk);color:var(--ink-2)':''}">v${h.v}</span></div><div><div class="row"><b>${esc(h.why)}</b></div><div class="muted small">${h.date} · approved by ${h.by}${i===0?' · current':''}</div><ul>${h.changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${i>0?`<button class="btn sm ghost" data-act="rollback" data-id="${h.v}">Roll back to v${h.v}</button>`:''}</div></div>`).join('')}</div>`}
function relPanel(){const r=S.rel;const pick=r.pick;const res=r.result;
  return `<section class="release"><div class="row" style="justify-content:space-between"><b>New release · check the impact on the foundations</b><button class="btn sm ghost" data-act="relclose">Close</button></div>
  <div class="relopts">${Object.entries(REL).map(([k,x])=>`<button class="relopt" data-act="relpick" data-id="${k}" aria-pressed="${pick===k}"><b>${x.name}</b><span>${esc(x.desc)}</span></button>`).join('')}<button class="relopt" data-act="relpick" data-id="custom" aria-pressed="${pick==='custom'}"><b>Your own release</b><span>Describe a feature and see how it’s classified</span></button></div>
  ${pick==='custom'?`<div class="form"><div class="field"><label for="rel-name">Feature name</label><input id="rel-name" value="${esc(r.custom.name)}" placeholder="e.g. Usage-based billing forecasts"></div><div class="field"><label for="rel-desc">What it does</label><input id="rel-desc" value="${esc(r.custom.desc)}" placeholder="One sentence"></div></div>`:''}

  <div class="stack"><div><div class="eyebrow" style="margin-bottom:6px">Analyst recommendation</div><p>Lead paid ads with the Explainable headline. It beat the umbrella line by 42% on CTR, and demo requests from those clicks were 31% higher.</p></div>
  <div class="note"><b>CMO:</b> Agreed for ads. I would not change the umbrella line in the foundations on one test. I’ve logged it as evidence for the next foundations review.</div>
  <div class="row"><span class="pill accent">No foundations change</span><span class="pill neutral">Logged as evidence</span></div></div></div>`}

/* ---------- connections ---------- */
function vConn(){return `<div class="conns">${S.connectors.map(c=>`<section class="card conn"><div class="conn-h"><div class="conn-logo" style="--c:${c.c}">${c.logo}</div><div><b>${c.name}</b><span>${c.what} · ${c.on?'<span style="color:var(--good)">Sample data</span>':'Paused'}</span></div><button class="switch" role="switch" aria-checked="${c.on}" aria-label="${c.on?'Pause':'Resume'} ${c.name}" data-act="ctoggle" data-id="${c.id}"></button></div>
  <ul>${c.metrics.map(m=>`<li>${m}</li>`).join('')}</ul><div class="conn-stats"><span>Last sync <b id="sync-${c.id}">${c.on?Math.round(c.ago)+'s ago':'paused'}</b></span><span>Rows <b id="rows-${c.id}">${c.rows.toLocaleString('en-US')}</b></span></div></section>`).join('')}</div>`}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const th=e.target.closest('[data-theme-set]');if(th){setTheme(th.dataset.themeSet);return}
  const g=e.target.closest('[data-go]');if(g){$('#toast').hidden=true;setView(g.dataset.go);return}
  const nb=e.target.closest('#nav button[data-view]');if(nb){setView(nb.dataset.view);return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;const it=S.review.find(r=>r.id===id);
  if(a==='preview'){S.sel=id;setView('review')}
  else if(a==='approve'){if(it.kind==='foundation'){it.from=F.ver;it.to=nextVer(REL[it.rel].impact);approveFoundation(it)}
    if(it.kind==='battlecard'){const m=S.materials.find(x=>x.id==='bcA');m.status='current';m.built=F.ver}
    it.status='approved';addFeed('cmo','You approved: '+it.title);if(it.kind!=='foundation')toast('Approved: '+it.title);S.sendback=false;render()}
  else if(a==='reject'){it.status='rejected';addFeed('cmo','You rejected: '+it.title);render()}
  else if(a==='undo'){it.status='pending';render()}
  else if(a==='rsel'){S.sel=id;S.sendback=false;S.more=false;render()}
  else if(a==='dev'){S.device=b.dataset.d;render()}
  else if(a==='post'){S.post=+b.dataset.i;S.more=false;render()}
  else if(a==='more'){S.more=true;render()}
  else if(a==='sendback'){S.sendback=true;render();const t=$('#sb-text');if(t)t.focus()}
  else if(a==='sbcancel'){S.sendback=false;render()}
  else if(a==='sbsend'){const r=S.review.find(x=>x.id===S.sel);const c=($('#sb-text').value||'').trim()||'Please tighten this up.';r.status='revising';S.sendback=false;addFeed('cmo',`Sent back to ${aName(r.agent)}: “${c}”`);render();
    setTimeout(()=>{r.status='pending';r.v++;r.note=`v${r.v}: ${aName(r.agent)} revised this after your comment “${c}”.`;addFeed(r.agent,`Revised ${r.title} (v${r.v})`);if(view==='review')render();else updateBadge();toast(r.title+' revised','review')},3000)}
  else if(a==='ftab'){S.ftab=id;S.fedit=false;render()}
  else if(a==='fedit'){S.fedit=true;render()}
  else if(a==='fcancel'){S.fedit=false;render()}
  else if(a==='fsave'){const st=$('#f-statement').innerText.trim();const parts=F.parts.map((p,i)=>($('#f-part-'+i).innerText||'').trim()||p[1]);const changed=[];if(st!==F.statement)changed.push('Positioning statement');parts.forEach((p,i)=>{if(p!==F.parts[i][1])changed.push(F.parts[i][0])});
    S.fedit=false;if(!changed.length){render();return}const old=F.ver,nv=nextVer('messaging');F.statement=st;parts.forEach((p,i)=>F.parts[i][1]=p);F.ver=nv;F.approved='12 Oct 2026';
    F.history.unshift({v:nv,date:'12 Oct 2026',by:'You',why:'Direct edit',changes:changed.map(c=>c+': edited')});const hit=S.materials.filter(m=>m.tags.includes('positioning'));hit.forEach(m=>{m.status='stale';m.staleFrom=old});
    addFeed('found',`You saved Foundations v${nv}. ${hit.length} materials flagged`);toast(`Saved as v${nv}. ${hit.length} materials flagged`,'materials');render()}
  else if(a==='rollback'){const h=F.history.find(x=>x.v===id);toast(`Rolling back creates a new version that restores v${h.v}. Available in the real build.`)}
  else if(a==='relopen'){S.rel.open=true;S.rel.result=null;S.rel.state='idle';render()}
  else if(a==='relclose'){S.rel.open=false;render()}
  else if(a==='relpick'){readRel();S.rel.pick=id;S.rel.result=null;S.rel.state='idle';render()}
  else if(a==='relcheck'){readRel();let key=S.rel.pick;if(key==='custom'){const nm=S.rel.custom.name.trim()||'New feature';const ds=S.rel.custom.desc.trim()||'A new capability.';key='cust'+Date.now();
      REL[key]={name:nm,desc:ds,impact:'messaging',why:'A new capability that adds a proof point. Positioning, ICP and buying committee stay the same. Send it back if you think it’s bigger.',diff:[{s:'Feature catalog',add:`${nm} · personas to confirm · date to be set`},{s:'Pillar · Fast to value · proof points',add:`${nm}: ${ds}`}],tags:['pillar:fast']}}
    S.rel.state='checking';setAgent('found','working','Checking a release');render();
    setTimeout(()=>{const R=REL[key];S.rel.state='done';setAgent('found','idle','Ready');let rid=null;
      if(R.impact==='none'){if(!F.features.some(f=>f[0]===R.name))F.features.push([R.name,R.desc,'All users','Planned','TBD']);addFeed('found',`${R.name}: no foundations impact. Added to the feature catalog`)}
      else{const ex=S.review.find(r=>r.rel===key&&r.status==='pending');if(ex)rid=ex.id;else{rid='fd-'+key+'-'+Date.now();S.review.unshift({id:rid,kind:'foundation',rel:key,title:'Foundations update: '+R.name,agent:'found',sum:`${R.impact==='positioning'?'Positioning':'Messaging'}-level: ${R.diff.length} sections change.`,status:'pending',v:1});addFeed('found',`Impact check: ${R.name} is a ${R.impact}-level change`)}}
      S.rel.result={...R,rid};if(view==='foundations')render();updateBadge()},1600)}
  else if(a==='matfix'){const m=S.materials.find(x=>x.id===id);m.status='proposed';addFeed('mat',`Update proposed for ${m.name}, rebuilt on v${F.ver}`);render();setTimeout(()=>{m.built=F.ver;m.status='current';addFeed(m.owner,`${m.name} updated to v${F.ver}`);if(view==='materials')render()},2500)}
  else if(a==='wtype'){S.wiz.type=id;S.wiz.name='';S.wiz.goal='';render()}
  else if(a==='wnext'){if(S.wiz.step===2)readWiz();if(S.wiz.step===1){const d=DEF[S.wiz.type];S.wiz.name=S.wiz.name||d[0];S.wiz.goal=S.wiz.goal||d[1]}S.wiz.step++;render()}
  else if(a==='wback'){if(S.wiz.step===2)readWiz();S.wiz.step--;render()}
  else if(a==='wsend'){const w=S.wiz;const id2='x'+Date.now();const isL=w.type==='t1'||w.type==='t2';
    const obj={id:id2,name:w.name,type:w.type,goal:w.goal,budget:w.budget,status:'Planning',progress:5};
    if(isL){Object.assign(obj,{tier:w.type==='t1'?'T1':'T2',date:w.date||'TBD',col:7,ready:{Product:['a','Release date to confirm'],Sales:['r','Not started'],CS:['r','Not started'],Marketing:['a','Plan in progress'],Web:['r','Not started'],Pricing:['a','To confirm'],Legal:['r','Not started']}});S.launches.push(obj)}else S.campaigns.unshift(obj);
    addFeed('cmo','New request: '+obj.name);S.wiz={step:1,type:'t1',name:'',goal:'',budget:12000,date:'',audience:'',message:''};runTeam(obj);setView('team')}
  else if(a==='ask')sendChat(b.dataset.q);
  else if(a==='ctoggle'){const c=conn(id);c.on=!c.on;addFeed(c.id,`${c.name} ${c.on?'resumed':'paused'}`);render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='chatform'){e.preventDefault();const i=$('#chatinput');sendChat(i.value);i.value=''}});
function readWiz(){const v=id=>($('#'+id)||{}).value;const w=S.wiz;w.name=v('w-name')||w.name;w.goal=v('w-goal')||w.goal;w.budget=Math.max(0,+v('w-budget')||w.budget);w.date=v('w-date')||'';w.audience=v('w-aud')||''}
function readRel(){const n=$('#rel-name'),d=$('#rel-desc');if(n)S.rel.custom.name=n.value;if(d)S.rel.custom.desc=d.value}

/* ================= live ticking ================= */
const SYNC={sf:()=>{const k=S.kpi.pipe;const add=5000+Math.random()*20000;k.v+=add;k.s[k.s.length-1]=k.v/1e6;return Math.random()<.4?`Salesforce: ${eur(add)} new influenced pipeline`:null},
  amp:()=>{const k=S.kpi.adopt;k.v=Math.min(60,k.v+Math.random()*.15);k.s[k.s.length-1]=k.v;return null},
  hs:()=>{const k=S.kpi.reps;if(Math.random()<.3){k.v=Math.min(95,k.v+1);k.s[k.s.length-1]=k.v;return 'Highspot: 3 reps opened the Competitor A battlecard'}return null},
  gong:()=>Math.random()<.6?['Gong: 2 new calls mention Competitor A pricing','Gong: “explainability” came up in 5 demos today','Gong: objection logged: “we already have a BI tool”'][Math.floor(Math.random()*3)]:null,
  g2:()=>Math.random()<.5?'G2: new 5-star review mentions setup speed':null,
  jira:()=>Math.random()<.5?'Jira: Deal Risk Scoring moved to QA':null,
  hub:()=>null,li:()=>null,ga4:()=>null};
function paint(){const k=$('#kpis');if(k){k.innerHTML=kpiTiles();const el=$('#k-pipe');if(el){el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),900)}}}
setInterval(()=>{S.connectors.forEach(c=>{if(!c.on)return;c.ago+=1;if(c.ago>=c.every){c.ago=0;c.rows+=1+Math.floor(Math.random()*40);const msg=SYNC[c.id]();if(msg)addFeed(c.id,msg);paint()}
  const s=$('#sync-'+c.id);if(s)s.textContent=Math.round(c.ago)+'s ago';const r=$('#rows-'+c.id);if(r)r.textContent=c.rows.toLocaleString('en-US')})},1000);

setTheme(document.documentElement.getAttribute('data-theme')||'light');
setView((location.hash||'').slice(1)||'command');
</script>
